# Local services. Start with `bun run db:up` (see docs/devops.md).
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      # Host port 55432: 5432 is often taken by a locally installed PostgreSQL.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The Neon serverless driver speaks WebSocket, not TCP. This proxy lets it
  # reach the local Postgres (src/server/db.ts points the driver here).
  neon-proxy:
    # Pinned by digest: the image publishes only a moving `latest` tag.
    image: ghcr.io/neondatabase/wsproxy@sha256:7f2e2149aa6a57ba382a140102fba44f5053f3e44389ccc18adcecf896054efb
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "5433:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Rate limits and idempotency keys (Upstash in production).
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # @upstash/redis speaks REST, not the Redis protocol; this emulates the
  # Upstash REST API on http://localhost:8079.
  redis-rest:
    # Pinned by digest: the image publishes only moving tags.
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

  # Catches every email locally. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
