# Production deployment on every merge to master (docs/devops.md).
# Migrations run before the new code: they must be backwards compatible.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, in order; never cancel one half-way.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migrate the production database
        run: bunx prisma migrate deploy
        env:
          # Neon's direct (non-pooled) connection string.
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}

      - name: Build
        run: bun run build

      # The build writes the Worker's config; wrangler deploy picks it up.
      # Runtime settings are Worker secrets (wrangler secret), not set here.
      - name: Deploy the Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
